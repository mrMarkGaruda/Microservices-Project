version: "3.7"
services:
  monolith:
    build:
      context: .
      dockerfile: monolith.Dockerfile
    ports:
      - "12101:5000"
    volumes:
      - ./src/fit:/app/src/fit
    links:
      - monolith-db
      - rabbitmq
    environment:
      - DATABASE_URL=postgresql://postgres:docker@monolith-db:5432/fit-db
      - FIT_API_KEY=some_very_secret_key
      - COACH_URL=http://coach:5000
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_DEFAULT_USER=rabbit
      - RABBITMQ_DEFAULT_PASS=docker
    networks:
      - fit
    depends_on:
      rabbitmq:
        condition: service_healthy
      monolith-db:
        condition: service_healthy
  coach:
    build:
      context: .
      dockerfile: coach.Dockerfile
    ports:
      - "12102:5000"
    volumes:
      - ./src/coach:/app/src/coach
    links:
      - coach-db
      - rabbitmq
    environment:
      - MONOLITH_URL=http://monolith:5000
      - FIT_API_KEY=some_very_secret_key
      - DATABASE_URL=postgresql://postgres:docker@coach-db:5432/coach-db
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_DEFAULT_USER=rabbit
      - RABBITMQ_DEFAULT_PASS=docker
      - BILLING_URL=http://billing:5003
    networks:
      - fit
      - fitnet
    depends_on:
      rabbitmq:
        condition: service_healthy

  monolith-db:
    image: postgres:latest
    ports:
      - "12100:5432"
    command: postgres -c max_connections=200
    user: postgres
    environment:
      - POSTGRES_DB=fit-db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-d", "fit-db"]
      interval: 5s
      timeout: 30s
      retries: 5
    networks:
      - fit

  coach-db:
    image: postgres:latest
    ports:
      - "12103:5432"
    command: postgres -c max_connections=200
    user: postgres
    environment:
      - POSTGRES_DB=coach-db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-d", "coach-db"]
      interval: 5s
      timeout: 30s
      retries: 5
    networks:
      - fit

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "12104:5672"
      - "12105:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=rabbit
      - RABBITMQ_DEFAULT_PASS=docker
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 5s
      timeout: 30s
      retries: 5
    networks:
      - fit
      - fitnet

  stats_db:
    image: postgres:15
    container_name: stats_db
    environment:
      POSTGRES_USER: stats_user
      POSTGRES_PASSWORD: stats_password
      POSTGRES_DB: stats_db
    volumes:
      - stats_db_data:/var/lib/postgresql/data
    ports:
      - "12107:5432"
    networks:
      - fitnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stats_user -d stats_db"]
      interval: 10s
      timeout: 5s
      retries: 5
  stats:
    build:
      context: ./src/stats
      dockerfile: Dockerfile
    container_name: stats_service
    depends_on:
      stats_db:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    ports:
      - "12106:5002"
    environment:
      - STATS_DATABASE_URL=postgresql://stats_user:stats_password@stats_db:5432/stats_db
      - STATS_SERVICE_PORT=5002
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER:-rabbit}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS:-docker}
      - LOG_LEVEL=DEBUG
    volumes:
      - ./src/stats:/app
    networks:
      - fitnet
    restart: unless-stopped

  billing_db:
    image: postgres:15
    container_name: billing_db
    environment:
      POSTGRES_USER: billing_user
      POSTGRES_PASSWORD: billing_password
      POSTGRES_DB: billing_db
    volumes:
      - billing_db_data:/var/lib/postgresql/data
    ports:
      - "12109:5432"
    networks:
      - fitnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing_user -d billing_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  billing:
    build:
      context: ./src/billing
      dockerfile: Dockerfile
    container_name: billing_service
    depends_on:
      billing_db:
        condition: service_healthy
    ports:
      - "12108:5003"
    environment:
      - BILLING_DATABASE_URL=postgresql://billing_user:billing_password@billing_db:5432/billing_db
      - BILLING_SERVICE_PORT=5003
      - LOG_LEVEL=DEBUG
    volumes:
      - ./src/billing:/app
    networks:
      - fitnet
    restart: unless-stopped

networks:
  fit:
  fitnet:
    driver: bridge

volumes:
  stats_db_data:
  billing_db_data:
